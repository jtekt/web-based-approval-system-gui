stages:
  - build
  - deploy

variables:
  APPLICATION_NAME: shinsei-manager-front
  CONTAINER_IMAGE: ${AWS_ECR_PUBLIC_URL}/${APPLICATION_NAME}

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: ${CI_COMMIT_TAG}
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  before_script:
    - aws ecr-public create-repository --repository-name ${APPLICATION_NAME} || echo "Repository might have already existed"
  script:
    - docker build --build-arg APP_VERSION=${IMAGE_TAG} -t ${CONTAINER_IMAGE}:${IMAGE_TAG} .
    - docker push ${CONTAINER_IMAGE}:${IMAGE_TAG}

deploy:
  stage: deploy
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        ENVIRONMENT: prod
        DEPLOYMENT_SUFFIX: ""
        IMAGE_TAG: ${CI_COMMIT_TAG}
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        ENVIRONMENT: staging
        DEPLOYMENT_SUFFIX: -staging
        IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    - kubectl config use-context eks/gitlab-agent-for-kubernetes:eks
    - kubectl config set-context --current --namespace=${KUBERNETES_NAMESPACE}
    - kubectl kustomize kustomize/overlays/${ENVIRONMENT} | envsubst | kubectl apply -f -
    - kubectl kustomize kustomize/overlays/pdf-${ENVIRONMENT} | envsubst | kubectl apply -f -
    - kubectl rollout status deployment/shinsei-manager-front${DEPLOYMENT_SUFFIX} --timeout=120s
    - kubectl rollout status deployment/shinsei-manager-front-pdf${DEPLOYMENT_SUFFIX} --timeout=120s
