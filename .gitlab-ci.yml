stages:
    - build
    - deploy

variables:
    CONTAINER_REPOSITORY_NAME: shinsei-manager-front
    CONTAINER_IMAGE: ${AWS_ECR_PUBLIC_URL}/${CONTAINER_REPOSITORY_NAME}
    CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:vue2-${CI_COMMIT_SHORT_SHA}

build:
    stage: build
    rules:
        - if: $CI_COMMIT_BRANCH == "vue-2"
        - when: never
    before_script:
        # Create repository in ECR if it does not exist yet
        - >
            aws ecr-public create-repository --region us-east-1 --repository-name ${CONTAINER_REPOSITORY_NAME}
            || echo "Repository might have already existed"
    script:
        # Building
        - docker build -t ${CONTAINER_IMAGE} .
        # Tagging
        - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_TAGGED}
        # Pushing
        - docker push ${CONTAINER_IMAGE}
        - docker push ${CONTAINER_IMAGE_TAGGED}

deploy:
    stage: deploy
    rules:
        - if: $CI_COMMIT_BRANCH == "vue-2"
        - when: never
    script:
        # create/update the deployment
        - envsubst < kubernetes_manifest.yml | kubectl apply -f -
    environment:
        name: production
        kubernetes:
            namespace: ${KUBERNETES_NAMESPACE} # Obtained from GitLab
