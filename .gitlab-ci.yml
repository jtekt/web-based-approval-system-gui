stages:
  - build
  - deploy

variables:
  APPLICATION_NAME: shinsei-manager-front
  CONTAINER_IMAGE: ${AWS_ECR_PUBLIC_URL}/${APPLICATION_NAME}

# --------
# Production (git tag on master)
# --------

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  tags:
    - dind
  before_script:
    - aws ecr-public create-repository --repository-name ${APPLICATION_NAME} || echo "Repository might have already existed"
  script:
    - docker build -t ${CONTAINER_IMAGE}:${CI_COMMIT_TAG} .
    - docker push ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}

deploy:
  stage: deploy
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG
    - when: never
  variables:
    MODE: prod
    IMAGE_TAG: ${CI_COMMIT_TAG}
  script:
    # Deploy production
    - kubectl kustomize kustomize/overlays/${MODE} | envsubst | kubectl apply -f -

    # Deploy production PDF
    - kubectl kustomize kustomize/overlays/pdf-${MODE} | envsubst | kubectl apply -f -

    # Rollout deployments
    - kubectl rollout status deployment/${APPLICATION_NAME} --timeout=600s
    - kubectl rollout status deployment/${APPLICATION_NAME}-pdf --timeout=600s
  environment:
    name: production
    kubernetes:
      namespace: ${KUBERNETES_NAMESPACE}

# --------
# Staging (staging branch)
# --------

build_staging:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - when: never
  before_script:
    - aws ecr-public create-repository --repository-name ${APPLICATION_NAME} || echo "Repository might have already existed"
  script:
    - docker build -t ${CONTAINER_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    - docker push ${CONTAINER_IMAGE}:${CI_COMMIT_SHORT_SHA}

deploy_staging:
  stage: deploy
  needs:
    - build_staging
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - when: never
  variables:
    MODE: staging
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    # Deploy staging
    - kubectl kustomize kustomize/overlays/${MODE} | envsubst | kubectl apply -f -

    # Deploy staging PDF
    - kubectl kustomize kustomize/overlays/pdf-${MODE} | envsubst | kubectl apply -f -

    # Rollout deployments
    - kubectl rollout status deployment/${APPLICATION_NAME}-staging --timeout=600s
    - kubectl rollout status deployment/${APPLICATION_NAME}-pdf-staging --timeout=600s
  environment:
    name: production
    kubernetes:
      namespace: ${KUBERNETES_NAMESPACE}
